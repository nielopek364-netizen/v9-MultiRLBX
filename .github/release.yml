changelog:
  exclude:
    authors:
      - dependabot[bot]
  categories:
    - title: Features & Enhancements
      labels:
        - enhancement
        - feature
    - title: Bug Fixes
      labels:
        - bug
        - fix
    - title: Security & Performance
      labels:
        - security
        - performance
    - title: Build & Documentation
      labels:
        - build
        - documentation
    - title: Other Changes
      labels:
        - "*"
